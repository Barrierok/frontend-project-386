pre-commit:
  jobs:
    - name: oxlint
      glob: "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx}"
      run: npx oxlint --fix {staged_files}
      stage_fixed: true

    - name: oxfmt
      glob: "*.{js,cjs,mjs,jsx,ts,cts,mts,tsx,json,jsonc,css,md,yml,yaml}"
      run: npx oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: lint commit message
      run: npx commitlint --edit {1}

pre-push:
  jobs:
    - name: check
      run: npm run check
